$kind: http-request
name: Login
description: "Login with email and password. Saves JWT token to environment automatically."
url: 'http://localhost:5000/api/auth/login'
method: POST
body:
  type: json
  content: |-
    {
      "email": "mohit@gmail.com",
      "password": "123456"
    }
order: 1786795700000
events:
  - listen: test
    script: |-
      const response = JSON.parse(pm.response.text());

      pm.environment.set("token", response.token);

      console.log("JWT token saved successfully:", response.token);
